<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>huina.cc</title>
<style>
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #0a0a0a;
    --fg: #ededed;
    --mut: #7a7a7a;
    --ln: #1f1f1f;
    --larp: #333;

    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --logo-size: clamp(60px, 14vw, 112px);
    --radius: 8px;

    --ease: cubic-bezier(.22, 1, .36, 1);
    --dur-fast: .2s;
    --dur-base: .25s;
  }

  html {
    background: var(--bg);
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-mono);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    overflow-x: hidden;
  }

  ::selection {
    background: var(--fg);
    color: var(--bg);
  }

  .wrap {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0;
  }

  .logo {
    font-size: var(--logo-size);
    font-weight: 800;
    letter-spacing: -.06em;
    line-height: .9;
    user-select: none;
    cursor: crosshair;
    position: relative;
    display: inline-block;
  }

  .logo span {
    color: var(--fg);
    display: inline-block;
  }

  .logo i {
    font-style: normal;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--fg);
    transition: color var(--dur-base) var(--ease), -webkit-text-stroke-color var(--dur-base) var(--ease);
    display: inline-block;
  }

  .logo:hover i {
    color: var(--fg);
    -webkit-text-stroke-color: transparent;
  }

  .logo:hover span {
    color: transparent;
    -webkit-text-stroke: 1.5px var(--fg);
  }

  .logo::after {
    content: "_";
    font-weight: 400;
    color: var(--mut);
    animation: blink 1.1s steps(1) infinite;
    margin-left: 4px;
  }

  .logo::before {
    content: attr(data-ghost);
    position: absolute;
    left: 2px;
    top: 2px;
    width: 100%;
    color: transparent;
    -webkit-text-stroke: 1px var(--larp);
    z-index: -1;
    pointer-events: none;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .go {
    margin-top: 40px;
    display: flex;
    gap: 10px;
  }

  .go a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    padding: 14px;
    border-radius: var(--radius);
    border: 1px solid #2a2a2a;
    color: var(--fg);
    position: relative;
    transition: transform var(--dur-fast) var(--ease),
                box-shadow var(--dur-fast) var(--ease),
                background var(--dur-fast) var(--ease),
                color var(--dur-fast) var(--ease);
  }

  .go a.solid {
    background: var(--fg);
    color: #000;
    border-color: var(--fg);
  }

  .go a.solid:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255, 255, 255, .15);
  }

  .go a.ghost:hover {
    background: var(--fg);
    color: #000;
    border-color: var(--fg);
  }

  .go a:active {
    transform: translateY(0) scale(.98);
  }

  .trail {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    font-size: 12px;
    color: var(--mut);
    z-index: 9999;
    user-select: none;
  }

  .clock {
    position: fixed;
    bottom: 14px;
    right: 18px;
    font-size: 11px;
    color: var(--mut);
    letter-spacing: .03em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <main>
      <h1 class="logo" id="logo" data-ghost="huina.cc">
        <span>huina</span><i>.cc</i>
      </h1>

      <div class="go">
        <a class="solid" href="huina.dll" download>download</a>
        <a class="ghost" href="https://github.com/itsdejavuuu/huina.cc" target="_blank" rel="noopener">sources</a>
      </div>
    </main>
  </div>

  <footer class="clock" id="clock">00:00:00</footer>

  <script>
  "use strict";

  const Huina = Object.freeze({
    glyphs: '!<>-_\\/[]{}—=+*^?#01',
    scramble: {
      frames: 24,
    },
    trail: {
      maxNodes: 40,
      throttleMs: 25,
      offsetX: 8,
      offsetY: 8,
    },
    blurTitle: 'pasta.cc',
  });

  function randomGlyph() {
    return Huina.glyphs[Math.floor(Math.random() * Huina.glyphs.length)];
  }

  class ScrambleFx {
    constructor(el, { text, splitAt, frames }) {
      this.el = el;
      this.text = text;
      this.splitAt = splitAt;
      this.totalFrames = frames;
      this.rafId = null;
    }

    init() {
      this.el.addEventListener('mouseenter', () => this.play());
      this.el.addEventListener('click', () => {
        void this.el.offsetWidth;
        this.play();
      });
    }

    play() {
      this.stop();
      let frame = 0;

      const tick = () => {
        frame += 1;
        const revealed = this._renderFrame(frame);
        this._paint(revealed);

        if (frame < this.totalFrames) {
          this.rafId = requestAnimationFrame(tick);
        } else {
          this._paint(this.text);
          this.rafId = null;
        }
      };

      this.rafId = requestAnimationFrame(tick);
    }

    stop() {
      if (this.rafId !== null) {
        cancelAnimationFrame(this.rafId);
        this.rafId = null;
      }
    }

    _renderFrame(frame) {
      let out = '';
      for (let i = 0; i < this.text.length; i++) {
        const char = this.text[i];
        if (char === '.') {
          out += '.';
          continue;
        }
        const isRevealed = (i / this.totalFrames) * this.totalFrames < frame;
        out += isRevealed ? char : randomGlyph();
      }
      return out;
    }

    _paint(value) {
      const head = value.slice(0, this.splitAt);
      const tail = value.slice(this.splitAt);
      this.el.innerHTML = `<span>${head}</span><i>${tail}</i>`;
    }
  }

  class Cursortrail {
    constructor({ maxNodes, throttleMs, offsetX, offsetY }) {
      this.maxNodes = maxNodes;
      this.throttleMs = throttleMs;
      this.offsetX = offsetX;
      this.offsetY = offsetY;
      this.nodes = [];
      this.lastSpawn = 0;
    }

    init() {
      document.addEventListener('mousemove', (event) => this._onMove(event));
    }

    _onMove(event) {
      const now = Date.now();
      if (now - this.lastSpawn < this.throttleMs) return;
      this.lastSpawn = now;

      this._spawn(event.clientX, event.clientY);
    }

    _spawn(x, y) {
      const node = document.createElement('span');
      node.className = 'trail';
      node.textContent = randomGlyph();
      node.style.left = `${x + this.offsetX}px`;
      node.style.top = `${y + this.offsetY}px`;

      document.body.appendChild(node);
      this.nodes.push(node);

      if (this.nodes.length > this.maxNodes) {
        this.nodes.shift().remove();
      }
    }
  }

  class Tabtitle {
    constructor(blurTitle) {
      this.originalTitle = document.title;
      this.blurTitle = blurTitle;
    }

    init() {
      window.addEventListener('blur', () => {
        document.title = this.blurTitle;
      });
      window.addEventListener('focus', () => {
        document.title = this.originalTitle;
      });
    }
  }

  class Clock {
    constructor(el) {
      this.el = el;
      this.timerId = null;
    }

    init() {
      this._tick();
      this.timerId = setInterval(() => this._tick(), 1000);
    }

    _tick() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      this.el.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
  }

  const App = {
    init() {
      const logoEl = document.getElementById('logo');
      const clockEl = document.getElementById('clock');

      new ScrambleFx(logoEl, {
        text: 'huina.cc',
        splitAt: 5,
        frames: Huina.scramble.frames,
      }).init();

      new Cursortrail(Huina.trail).init();
      new Tabtitle(Huina.blurTitle).init();
      new Clock(clockEl).init();

      this._logBanner();
    },

    _logBanner() {
      console.log(
        '%chuina.cc',
      );
      console.log(
        '%clooking for something?',
      );
    },
  };

  document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
